# Default Log4j 2 configuration for RDF tests.
status = warn
name = BigdataRdfTests

appender.console.type = Console
appender.console.name = dest1
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p: %F:%L: %m%n

appender.ruleLog.type = File
appender.ruleLog.name = ruleLog
appender.ruleLog.fileName = rules.log
appender.ruleLog.append = true
appender.ruleLog.immediateFlush = true
appender.ruleLog.layout.type = PatternLayout
appender.ruleLog.layout.pattern = %m

appender.queryLog.type = File
appender.queryLog.name = queryLog
appender.queryLog.fileName = queryLog.csv
appender.queryLog.append = true
appender.queryLog.immediateFlush = true
appender.queryLog.layout.type = PatternLayout
appender.queryLog.layout.pattern = %m

appender.runStateLog.type = File
appender.runStateLog.name = queryRunStateLog
appender.runStateLog.fileName = queryRunState.log
appender.runStateLog.append = true
appender.runStateLog.immediateFlush = true
appender.runStateLog.layout.type = PatternLayout
appender.runStateLog.layout.pattern = %m

appender.solutionsLog.type = Console
appender.solutionsLog.name = solutionsLog
appender.solutionsLog.target = SYSTEM_OUT
appender.solutionsLog.layout.type = PatternLayout
appender.solutionsLog.layout.pattern = SOLUTION:\t%m

appender.sparqlLog.type = Console
appender.sparqlLog.name = sparqlLog
appender.sparqlLog.target = SYSTEM_OUT
appender.sparqlLog.layout.type = PatternLayout
appender.sparqlLog.layout.pattern = #----------%d-----------tx=%X{tx}\n%m\n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = dest1

logger.bigdata.name = com.bigdata
logger.bigdata.level = WARN

logger.btree.name = com.bigdata.btree
logger.btree.level = WARN

logger.ruleLog.name = com.bigdata.relation.rule.eval.RuleLog
logger.ruleLog.level = INFO
logger.ruleLog.additivity = false
logger.ruleLog.appenderRef.file.ref = ruleLog

logger.queryLog.name = com.bigdata.bop.engine.QueryLog
logger.queryLog.additivity = false

logger.runStateLog.name = com.bigdata.bop.engine.RunState$TableLog
logger.runStateLog.additivity = false

logger.solutionsLog.name = com.bigdata.bop.engine.SolutionsLog
logger.solutionsLog.additivity = false

logger.sparqlTrace.name = com.bigdata.rdf.sparql.ast.eval.ASTEvalHelper
logger.sparqlTrace.level = WARN
logger.sparqlTrace.additivity = false
