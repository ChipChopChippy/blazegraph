# Default Log4j 2 configuration for Sail TCK tests.
status = warn
name = BigdataSailTckTests

appender.console.type = Console
appender.console.name = dest1
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p: %r %t %X{hostname} %X{serviceUUID} %X{commitCounter} %X{taskname} %X{resources} %X{timestamp} %X{taskState} %X{activeTasks} %l: %m%n

appender.resourceManager.type = File
appender.resourceManager.name = A2
appender.resourceManager.fileName = ResourceManager.log
appender.resourceManager.append = true
appender.resourceManager.immediateFlush = true
appender.resourceManager.layout.type = PatternLayout
appender.resourceManager.layout.pattern = %5p [%t] %l %d - %m%n

appender.solutionsLog.type = Console
appender.solutionsLog.name = solutionsLog
appender.solutionsLog.target = SYSTEM_OUT
appender.solutionsLog.layout.type = PatternLayout
appender.solutionsLog.layout.pattern = SOLUTION:\t%m

appender.sparqlLog.type = Console
appender.sparqlLog.name = sparqlLog
appender.sparqlLog.target = SYSTEM_OUT
appender.sparqlLog.layout.type = PatternLayout
appender.sparqlLog.layout.pattern = #----------%d-----------tx=%X{tx}\n%m\n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = dest1

logger.bigdata.name = com.bigdata
logger.bigdata.level = ERROR

logger.tck.name = com.bigdata.rdf.sail.tck.DavidsBigdataSparqlTest
logger.tck.level = INFO

logger.testCase.name = junit.framework.Test
logger.testCase.level = INFO

logger.solutionsLog.name = com.bigdata.bop.engine.SolutionsLog
logger.solutionsLog.additivity = false

logger.sparqlTrace.name = com.bigdata.rdf.sparql.ast.eval.ASTEvalHelper
logger.sparqlTrace.level = WARN
logger.sparqlTrace.additivity = false
