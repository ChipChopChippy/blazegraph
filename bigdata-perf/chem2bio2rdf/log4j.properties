# Log4j 2 configuration for the chem2bio2rdf workload.
status = warn
name = BigdataChem2Bio2Rdf

appender.console.type = Console
appender.console.name = dest1
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p: %F:%L: %m%n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = dest1

logger.bigdata.name = com.bigdata
logger.bigdata.level = WARN

logger.lruNexus.name = com.bigdata.LRUNexus
logger.lruNexus.level = INFO

logger.nanoServer.name = com.bigdata.rdf.sail.webapp.NanoSparqlServer
logger.nanoServer.level = INFO

logger.servletListener.name = com.bigdata.rdf.sail.webapp.BigdataRDFServletContextListener
logger.servletListener.level = INFO

logger.blockingBuffer.name = com.bigdata.relation.accesspath.BlockingBuffer
logger.blockingBuffer.level = ERROR

logger.dataLoader.name = com.bigdata.rdf.store.DataLoader
logger.dataLoader.level = INFO
