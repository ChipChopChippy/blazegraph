# Log4j 2 configuration for the BSBM workload.
status = warn
name = BigdataBsbm

appender.console.type = Console
appender.console.name = dest1
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p: %F:%L: %m%n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = dest1

logger.bigdata.name = com.bigdata
logger.bigdata.level = WARN

logger.graphRunner.name = com.bigdata.rdf.graph.impl.util.GASRunnerBase
logger.graphRunner.level = INFO

logger.sailRunner.name = com.bigdata.rdf.graph.impl.sail.SAILGASRunner
logger.sailRunner.level = INFO

logger.bigdataRunner.name = com.bigdata.rdf.graph.impl.bd.BigdataRunner
logger.bigdataRunner.level = INFO

logger.gasUtil.name = com.bigdata.rdf.graph.util.GASUtil
logger.gasUtil.level = INFO
