# Default Log4j 2 configuration for Blueprints tests.
status = warn
name = BigdataBlueprintsTests

appender.console.type = Console
appender.console.name = dest2
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p: %r %X{hostname} %X{serviceUUID} %X{taskname} %X{timestamp} %X{resources} %t %l: %m%n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = dest2

logger.bigdata.name = com.bigdata
logger.bigdata.level = WARN

logger.btree.name = com.bigdata.btree
logger.btree.level = WARN

logger.history.name = com.bigdata.counters.History
logger.history.level = ERROR

logger.xmlHandler.name = com.bigdata.counters.XMLUtility$MyHandler
logger.xmlHandler.level = ERROR

logger.blockingBuffer.name = com.bigdata.relation.accesspath.BlockingBuffer
logger.blockingBuffer.level = ERROR

logger.rdfLoad.name = com.bigdata.rdf.load
logger.rdfLoad.level = INFO

logger.dataLoader.name = com.bigdata.rdf.store.DataLoader
logger.dataLoader.level = INFO

logger.overflow.name = com.bigdata.resources.AsynchronousOverflowTask
logger.overflow.level = INFO

logger.testCase.name = junit.framework.TestCase2
logger.testCase.level = ERROR
